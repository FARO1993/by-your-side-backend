name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# test-reporter necesita escribir el check "Maven Tests" (y lee los artifacts).
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    # Versión fija: ubuntu-latest pasa a Ubuntu 26 el 19/10/2026; se cambia a mano.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn clean verify -B

      # Publica el detalle de cada test (también en el resumen del job), así
      # cuando algo falla se ve cuál fue sin bajar los logs.
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Maven Tests
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  docker-build:
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: by-your-side-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
