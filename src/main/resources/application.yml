server:
  port: 8080

spring:
  application:
    name: by-your-side-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:by_your_side}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    # En produccion, JWT_SECRET debe venir de una variable de entorno/secret manager,
    # nunca del valor por defecto. Minimo 32 caracteres para HS256.
    secret: ${JWT_SECRET:change-this-secret-in-production-min-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    admin-bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}

logging:
  level:
    org.hibernate.SQL: info
